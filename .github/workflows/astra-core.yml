name: Verify Astra Forge CSharp core
on:
  push:
    branches: [main]
    paths: ['unity/**', '.github/workflows/astra-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile shared core and verify local tournament rules
        run: dotnet run --project unity/AstraForge/Verification/Verification.csproj
